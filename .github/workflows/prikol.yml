name: Штучка дрючка закорючка

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*", "dev*" ]

jobs:
  asp-api_unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v6

    - name: Установка Node
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: npm
        cache-dependency-path: WaaaHa!-patcher.React/package-lock.json

    - name: Установка зависимостей React
      run: npm ci
      working-directory: ./WaaaHa!-patcher.React

    - name: Установка .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # На своей машине запускать без фильтра.
    - name: Виновник торжества
      run: dotnet test 'WaaaHa!-patcher.API.UnitTests' --filter 'Category!=RealProfile'

  build:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/dev')
    needs: asp-api_unit-tests
    runs-on: ubuntu-latest

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v6

    - name: Установка Node
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: npm
        cache-dependency-path: WaaaHa!-patcher.React/package-lock.json

    - name: Установка зависимостей React
      run: npm ci
      working-directory: ./WaaaHa!-patcher.React

    - name: Установка .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Публикация API (со вшитым .NET, один бинарник)
      run: |
        RAW_VER="${GITHUB_REF_NAME#v}"
        CLEAN_VER="${RAW_VER#dev}"
        dotnet publish 'WaaaHa!-patcher.API/WaaaHa!-patcher.API.csproj' -c Release -r win-x64 -o ./publish-x64 -p:Version="$CLEAN_VER" -p:SelfContained=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true

    - name: Публикация API (без вшитого .NET, lite)
      run: |
        RAW_VER="${GITHUB_REF_NAME#v}"
        CLEAN_VER="${RAW_VER#dev}"
        dotnet publish 'WaaaHa!-patcher.API/WaaaHa!-patcher.API.csproj' -c Release -r win-x64 -o ./publish-x64-lite -p:Version="$CLEAN_VER" -p:SelfContained=false -p:PublishSingleFile=true

    - name: Упаковка API в архив
      run: |
        7z a -tzip -mx=9 'WaaaHa!-Patcher_win-x64.zip' ./publish-x64/*
        7z a -tzip -mx=9 'WaaaHa!-Patcher_win-x64-lite.zip' ./publish-x64-lite/*

    - name: Сохраняем артефакт x64
      uses: actions/upload-artifact@v4
      with:
        name: WaaaHa!-Patcher_win-x64
        path: WaaaHa!-Patcher_win-x64.zip

    - name: Сохраняем артефакт x64 без вшитого .NET
      uses: actions/upload-artifact@v4
      with:
        name: WaaaHa!-Patcher_win-x64-lite
        path: WaaaHa!-Patcher_win-x64-lite.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/dev')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Забираем артефакты
      uses: actions/download-artifact@v4
      with:
        pattern: WaaaHa!-Patcher_win-x64*
        merge-multiple: true

    - name: Генерация SHA256
      run: sha256sum 'WaaaHa!-Patcher_win-x64.zip' 'WaaaHa!-Patcher_win-x64-lite.zip' > checksums.txt

    - name: Проверка типа релиза (dev или stable)
      id: check_version
      run: |
        TAG="${GITHUB_REF_NAME}"

        if [[ "$TAG" =~ ^dev ]]; then
          echo "Тег начинается на dev: помечаем как prerelease, latest выключаем"
          echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          echo "is_latest=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Если тег не dev (то есть стабильный v*), он не является prerelease
        echo "is_prerelease=false" >> "$GITHUB_OUTPUT"

        # Находим среди стабильных тегов v* максимальный по SemVer
        HIGHEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)

        # latest назначается только если текущий тег равен наибольшему стабильному
        if [ "$TAG" = "$HIGHEST_TAG" ]; then
          echo "Текущий тег $TAG является наивысшим релизом"
          echo "is_latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "Текущий тег $TAG старше или ниже максимального ($HIGHEST_TAG)"
          echo "is_latest=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Обновление тега latest
      if: steps.check_version.outputs.is_latest == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f latest
        git push -f origin latest

    - name: Создаём релиз на GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: |
          WaaaHa!-Patcher_win-x64.zip
          WaaaHa!-Patcher_win-x64-lite.zip
          checksums.txt
        body: |
          # Что скачивать:
          - WaaaHa!-Patcher_win-x64.zip - Автономная версия, запустится везде.
          - WaaaHa!-Patcher_win-x64-lite.zip - Лёгкая, но на вашем компьютере обязательно должен быть установлен ASP.NET или не запустится.
        prerelease: ${{ steps.check_version.outputs.is_prerelease == 'true' }}
        make_latest: ${{ steps.check_version.outputs.is_latest }}